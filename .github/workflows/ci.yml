name: CI

on:
  push:
    branches: [main, "semana-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockwise
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: stockwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_USER: stockwise
      TEST_POSTGRES_PASSWORD: ci_password
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: stockwise_test

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas (unitarias e integración)
        run: pytest -v
